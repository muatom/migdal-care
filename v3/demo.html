<style>/* Migdal Care v1 · tokens.css · THE shared token contract for deck, chat and demo.
   Section 1 is copied verbatim from the migdal-design skill (colors_and_type.css :root).
   Section 2 adds Migdal Care tokens. Never rename; add only. Fonts are injected by build.py. */
:root {
  /* ---------- BRAND CORE ---------- */
  --mig-ink:        #020140; /* primary navy — logo, body text, dark surfaces */
  --mig-ink-2:      #212058; /* softened navy — headings over light-blue bgs   */
  --mig-ink-3:      #1a1b39; /* near-black navy — Figma deep text                */
  --mig-blue:       #3c65e3; /* signature indigo — links, focus, "מגדל שלי"      */
  --mig-blue-deep:  #2a49ad; /* pressed / visited indigo                        */
  --mig-magenta:    #af005f; /* rare special accent — promos / "חדש" tags        */
  --mig-green:      #a2eb9a; /* signature mint — primary CTA fill               */
  --mig-green-600:  #8fe086; /* CTA hover                                       */
  --mig-green-700:  #74cf6f; /* CTA pressed                                     */
  --mig-green-soft: #96e6a1; /* mascot / illustration green                     */

  /* ---------- NEUTRALS ---------- */
  --mig-white:      #ffffff;
  --mig-paper:      #fbfbfb; /* page surface — verified vs Figma "light gray migdal" */
  --mig-mist:       #f3f6fb; /* section band / hover row                        */
  --mig-line-soft:  #e1e9f3; /* THE hairline — input/card border (Figma 216×)   */
  --mig-line:       #d4ddec; /* borders, dividers                               */
  --mig-line-blue:  #bdd2eb; /* blue-gray border on tinted surfaces             */
  --mig-slate-400:  #9aa3bd; /* muted text, placeholders                        */
  --mig-slate-600:  #5b658a; /* secondary text                                  */

  /* ---------- NEUTRAL SLATE RAMP (real Figma greys) ---------- */
  --mig-gray-900:   #101828; /* densest body / table text                       */
  --mig-gray-700:   #364153; /* strong secondary text                           */
  --mig-gray-600:   #4a5565; /* secondary text / icons                          */
  --mig-gray-500:   #6a7282; /* muted text                                      */
  --mig-gray-400:   #666666; /* placeholder / helper text                       */
  --mig-gray-300:   #ababab; /* disabled text                                   */
  --mig-gray-200:   #e3e3e3; /* disabled border / track                         */
  --mig-gray-100:   #f6f6f6; /* neutral chip / disabled fill                    */

  /* ---------- INFO / BLUE TINTS (callouts, selected rows, banners) ---------- */
  --mig-tint:       #e3eef8; /* primary light-blue band (Figma 247×)            */
  --mig-tint-info:  #e8f4ff; /* info callout fill                               */
  --mig-tint-faint: #f5faff; /* faintest blue wash                              */
  --mig-tint-cool:  #cfe0f3; /* selected / pressed tint                         */

  /* ---------- MARKETING / GRADIENT ---------- */
  --mig-sky-1:      #d0ebfa; /* hero sky top                                    */
  --mig-sky-2:      #def0f9; /* hero sky mid                                    */
  --mig-sand:       #ecf0f3; /* hero floor / horizon                            */
  --grad-hero: linear-gradient(180deg, var(--mig-sky-1) 0%, var(--mig-sky-2) 48%, var(--mig-sand) 100%);

  /* ---------- SEMANTIC ---------- */
  --fg-1:           var(--mig-ink);      /* primary text          */
  --fg-2:           var(--mig-slate-600);/* secondary text        */
  --fg-3:           var(--mig-slate-400);/* tertiary / disabled   */
  --fg-on-dark:     var(--mig-white);
  --fg-link:        var(--mig-blue);
  --bg-1:           var(--mig-white);    /* base surface          */
  --bg-2:           var(--mig-mist);     /* raised band           */
  --bg-dark:        var(--mig-ink);      /* dark surface          */
  --accent:         var(--mig-green);    /* primary action        */
  --accent-fg:      var(--mig-ink);      /* text on green         */
  /* ---------- BRAND GOLD (ratings, highlights, warnings) ---------- */
  --mig-gold:       #ffd044; /* rating star / highlight fill           */
  --mig-amber:      #f5af35; /* warning fill / attention               */
  --mig-amber-soft: #ffcb80; /* soft amber tint                        */

  --success:        #3f8568; /* muted, mint-family green               */
  --success-bg:     #e9f6ef; /* success callout fill                   */
  --warning:        #8f7636; /* warning TEXT (legible on white)        */
  --warning-bg:     #fff6e3; /* warning callout fill (amber wash)      */
  --error:          #ee6a5f; /* validation / required — real Figma coral */
  --error-strong:   #ff4444; /* hard error / destructive               */
  --error-bg:       #fdecea; /* error callout fill                     */
  --required:       var(--error); /* asterisk on required fields        */
  --info:           var(--mig-blue);
  --info-bg:        var(--mig-tint-info); /* info callout fill          */

  /* ---------- TYPE FAMILIES ---------- */
  --font-display: "Migdal RagSans", "Heebo", system-ui, sans-serif;
  --font-body:    "Migdal RagSans", "Assistant", system-ui, sans-serif;
  --font-mono:    "SFMono-Regular", ui-monospace, "Menlo", monospace;

  /* ---------- TYPE SCALE — font sizes (px @ 16 root) ---------- */
  --fs-display: 60px;
  --fs-h1:      44px;
  --fs-h2:      32px;
  --fs-h3:      24px;
  --fs-h4:      20px;
  --fs-lead:    22px;
  --fs-body:    18px;
  --fs-sm:      16px;
  --fs-cap:     14px;
  --fs-micro:   12px;

  /* ---------- TYPE SCALE — line heights ---------- */
  --lh-display: 1.04; /* @kind font */
  --lh-h1:      1.08; /* @kind font */
  --lh-h2:      1.12; /* @kind font */
  --lh-h3:      1.2;  /* @kind font */
  --lh-h4:      1.25; /* @kind font */
  --lh-lead:    1.45; /* @kind font */
  --lh-body:    1.55; /* @kind font */
  --lh-sm:      1.5;  /* @kind font */
  --lh-cap:     1.45; /* @kind font */
  --lh-micro:   1.4;  /* @kind font */

  /* ---------- TYPE SCALE — letter spacing ---------- */
  --ls-display: -0.01em; /* @kind font */
  --ls-h1:      -0.01em; /* @kind font */

  /* ---------- FONT WEIGHTS ---------- */
  --fw-light: 300; /* @kind font */
  --fw-reg:   400; /* @kind font */
  --fw-med:   500; /* @kind font */
  --fw-semi:  600; /* @kind font */
  --fw-bold:  700; /* @kind font */
  --fw-black: 800; /* @kind font */

  /* ---------- SPACING (4px base) ---------- */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;
  --sp-20: 80px; --sp-24: 96px;

  /* ---------- RADII ---------- */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;

  /* ---------- ELEVATION ---------- */
  --sh-1: 0 1px 2px rgba(2,1,64,.06), 0 1px 1px rgba(2,1,64,.04);
  --sh-2: 0 4px 12px rgba(2,1,64,.08);
  --sh-3: 0 12px 32px rgba(2,1,64,.10);
  --sh-card: 0 18px 48px rgba(2,1,64,.12); /* big elevated marketing card */
  --sh-focus: 0 0 0 3px rgba(61,101,227,.35);
}

/* ---------- 2 · Migdal Care additions ---------- */
:root{
  /* fonts: "Migdal RagSans" @font-face is generated by build.py (the "@fonts" marker in the src html) */
  --font-ui: "Migdal RagSans", Heebo, Assistant, system-ui, sans-serif;
  --fw-black: 900;            /* override: 800 renders the Bold cut, Black cut needs 900 */
  --fw-xlight: 200;

  /* status chips */
  --st-pilot-bg:#e9f6ef; --st-pilot-fg:#3f8568;      /* קיים בפיילוט */
  --st-new-bg:var(--mig-green); --st-new-fg:var(--mig-ink); /* חדש */
  --st-vision-line:var(--mig-ink);                    /* חזון: dashed outline */
  --st-tbd-bg:#fff6e3; --st-tbd-fg:#8f7636;           /* לבירור / לאימות */
  --st-offer-bg:#e7ecfb; --st-offer-fg:var(--mig-blue); /* הצעה */
  --st-out:#9aa3bd;                                   /* לא נכלל (grey) */

  /* component legend */
  --k-ai:var(--mig-magenta);   /* AI: magenta dot */
  --k-api:var(--mig-blue);     /* ממשק: indigo square */
  --k-rule:var(--mig-ink);     /* חוקה עסקית: navy diamond */

  /* dark slide glows */
  --glow-indigo: rgba(60,101,227,.30);
  --glow-mint:   rgba(162,235,154,.16);

  /* motion */
  --dur-fast:200ms; --dur-med:400ms; --dur-draw:1200ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --stagger:120ms;

  /* page chrome (the only tokens that change in dark mode) */
  --page-bg:#e6ebf3;
  --page-fg:var(--mig-ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#05041f; --page-fg:#ffffff; }
}
:root[data-theme="dark"]{ --page-bg:#05041f; --page-fg:#ffffff; }
</style>
<style>/* Migdal Care v1 · base.css · shared by the deck and the demo.
   Reset, brand text defaults, bidi helpers, icons, focus, keyframes, and the status grammar
   (chips, wave chips, phase and persona chips, coverage status dots, component legend, CARE pills).
   Component sizes come from variables so each surface sets its own scale:
     --chip-fs, --chip-py, --chip-px, --chip-gap, --chip-bw, --mark   (defaults below are demo px sizes;
   deck.css redefines them per mode in canvas units). Colours come only from tokens.css. */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  font-weight: 300;
  color: var(--page-fg);
  background: var(--page-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
b, strong { font-weight: 700; }
img, svg, video { max-width: 100%; }
img { display: block; height: auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
p, h1, h2, h3, h4, h5, h6, ol, ul, figure, blockquote { margin: 0; }
ol, ul { padding: 0; list-style: none; }

/* Latin brand words and mixed-direction tokens */
bdi.en, .en { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
bdi.ltr, .ltr { direction: ltr; unicode-bidi: isolate; }
.tabular, .num { font-variant-numeric: tabular-nums; }
.num { unicode-bidi: isolate; }
.num-missing { background: var(--error-bg); color: var(--mig-ink); outline: 2px dashed var(--error); }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* focus: the indigo ring from the design system */
:focus { outline: none; }
:focus-visible { outline: none; box-shadow: var(--sh-focus); border-radius: var(--r-xs); }

/* icons: <svg class="ic"><use href="#i-stethoscope"/></svg> (sprite in icons.svg) */
.ic {
  width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.14em;
  fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
}
.ic.solid { fill: currentColor; stroke: none; }

/* ---------- keyframes (used by the deck primitives; free to reuse) ---------- */
@keyframes mc-rise { from { opacity: 0; transform: translateY(var(--rise, 20px)); } to { opacity: 1; transform: none; } }
@keyframes mc-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mc-pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes mc-open { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes mc-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes mc-fill { from { transform: scaleX(0); } to { transform: none; } }
@keyframes mc-grow-y { from { transform: scaleY(0); } to { transform: none; } }
@keyframes mc-slide-in { from { opacity: 0; transform: translateX(var(--slide-from, -24px)); } to { opacity: 1; transform: none; } }
@keyframes mc-pulse { 0% { box-shadow: 0 0 0 0 rgba(60,101,227,.45); } 100% { box-shadow: 0 0 0 var(--pulse-r, 14px) rgba(60,101,227,0); } }
@keyframes mc-pulse-amber { 0% { box-shadow: 0 0 0 0 rgba(245,175,53,.55); } 100% { box-shadow: 0 0 0 var(--pulse-r, 14px) rgba(245,175,53,0); } }
@keyframes mc-pulse-slate { 0% { box-shadow: 0 0 0 0 rgba(91,101,138,.40); } 100% { box-shadow: 0 0 0 var(--pulse-r, 14px) rgba(91,101,138,0); } }

/* ================= status grammar (plan 2.1) ================= */
.chip, .wave, .phase, .persona, .care-pill, .goal-chip, .trigger {
  display: inline-flex; align-items: center; gap: var(--chip-gap, 6px);
  font-family: var(--font-ui); font-weight: 700;
  font-size: var(--chip-fs, 13px); line-height: 1.2;
  padding: var(--chip-py, 3px) var(--chip-px, 10px);
  border-radius: var(--r-pill);
  border: var(--chip-bw, 1px) solid transparent;
  white-space: nowrap; vertical-align: middle;
  background: var(--mig-mist); color: var(--mig-slate-600);
}
.chip > .ic, .wave > .ic, .phase > .ic, .persona > .ic, .trigger > .ic { width: 1.1em; height: 1.1em; }

/* a chip never stretches inside a flex column */
.col > .chip, .kpi > .chip, .card > .chip, .col > .wave, .card > .wave, [data-num-chipel] { align-self: flex-start; }

/* status chips */
.chip.st-pilot  { background: var(--st-pilot-bg); color: var(--st-pilot-fg); }                 /* קיים בפיילוט */
.chip.st-new    { background: var(--st-new-bg);   color: var(--st-new-fg); }                   /* חדש */
.chip.st-vision { background: transparent; color: var(--mig-ink); border-color: var(--st-vision-line); border-style: dashed; } /* חזון */
.chip.st-tbd    { background: var(--st-tbd-bg);   color: var(--st-tbd-fg); }                   /* לבירור / לאימות */
.chip.st-offer  { background: var(--st-offer-bg); color: var(--st-offer-fg); }                 /* הצעה */
.chip.st-biz    { background: var(--mig-mist);    color: var(--mig-slate-600); }               /* ייקבע עם העסק */
.chip.st-ext    { background: var(--mig-white);   color: var(--mig-slate-600); border-color: var(--mig-slate-600); border-width: max(1px, calc(var(--chip-bw, 1px) * .7)); } /* חיצוני · לפי החברה */
.chip.st-out    { background: var(--mig-gray-100); color: var(--st-out); }                     /* לא נכלל */
.chip.st-ok     { background: var(--st-pilot-bg); color: var(--st-pilot-fg); }                 /* אומת */
.chip.st-ink    { background: var(--mig-ink); color: var(--mig-white); }
.chip.st-mint-line { background: var(--mig-white); color: var(--mig-ink); border-color: var(--mig-green-700); }

/* wave chips: גל 1 / גל 2 (indigo outline) · חזון (dashed) */
.wave { background: transparent; color: var(--mig-blue); border-color: var(--mig-blue); }
.wave.vision, .wave.st-vision { color: var(--mig-ink); border-color: var(--mig-ink); border-style: dashed; }

/* journey phase chips: לפני · בזמן התביעה · אחרי */
.phase { background: var(--mig-tint); color: var(--mig-ink); }
.phase.is-active, .phase[aria-current="true"] { border-color: var(--mig-blue); box-shadow: inset 0 0 0 calc(var(--chip-bw, 1px) * .5) var(--mig-blue); }

/* persona chips: לקוח · סוכן · מיישב · שירות קו ראשון · שירות שב״ן · רופא */
.persona { background: var(--mig-mist); color: var(--mig-slate-600); }
.persona.doctor, .persona.vision { background: transparent; border-color: var(--mig-slate-600); border-style: dashed; }

/* goal chips 01 / 02 / 03 / +1 */
.goal-chip { background: var(--mig-ink); color: var(--mig-white); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.goal-chip.plus { background: var(--mig-green); color: var(--mig-ink); }
.goal-chip.muted { background: var(--mig-slate-400); color: var(--mig-white); }

/* trigger chips (slide 13): indigo or mint */
.trigger { background: var(--st-offer-bg); color: var(--mig-blue); }
.trigger.mint { background: var(--mig-green); color: var(--mig-ink); }

/* CARE letter pills: C · A · R · E */
.care-pill {
  background: var(--mig-ink); color: var(--mig-green); direction: ltr; unicode-bidi: isolate;
  letter-spacing: .08em; font-weight: 900;
}
.care-pill.light { background: var(--mig-green); color: var(--mig-ink); }

/* coverage status: always a coloured dot plus a word */
.status { display: inline-flex; align-items: center; gap: .45em; font-weight: 700; color: var(--mig-ink); }
.status::before { content: ""; width: .62em; height: .62em; border-radius: 50%; flex: none; background: var(--st-out); }
.status.ok::before    { background: var(--mig-green-700); }   /* מכוסה */
.status.warn::before  { background: var(--mig-amber); }       /* החרגה · לאימות */
.status.need::before  { background: var(--mig-blue); }        /* נדרש אישור */
.status.out::before   { background: var(--st-out); }          /* לא נכלל */
.status.out { color: var(--mig-slate-600); }

/* component legend markers: AI (magenta dot) · ממשק (indigo square) · חוקה עסקית (navy diamond) */
.legend-ai, .legend-api, .legend-rule { display: inline-flex; align-items: center; gap: .5em; font-weight: 700; white-space: nowrap; }
.legend-ai::before, .legend-api::before, .legend-rule::before, .k-mark {
  content: ""; display: inline-block; flex: none; width: var(--mark, .62em); height: var(--mark, .62em);
}
.legend-ai::before, .k-mark.ai { background: var(--k-ai); border-radius: 50%; }
.legend-api::before, .k-mark.api { background: var(--k-api); border-radius: 2px; }
.legend-rule::before, .k-mark.rule { background: var(--k-rule); transform: rotate(45deg) scale(.86); border-radius: 1px; }
.k-mark { vertical-align: middle; }
</style>
<style>/* Migdal Care v1 · chat.css · the phone screen and every chat component (plan 3.2, 4.5, 4.6).

.mc-ic { width: calc(18 * var(--dpx)); height: calc(18 * var(--dpx)); fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.mc-head-btn { width: calc(32 * var(--dpx)); height: calc(32 * var(--dpx)); display: grid; place-items: center; border-radius: 50%; color: var(--mc-slate); }

/* ---------- the log ---------- */
.mc-log {
  position: relative; /* the offset parent of its bubbles: the engine scrolls by offsetTop */
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: calc(8 * var(--dpx));
  padding: calc(14 * var(--dpx)) calc(12 * var(--dpx)) calc(12 * var(--dpx));
  background: linear-gradient(180deg, #f8fafd 0, var(--mc-bg) calc(160 * var(--dpx)));
  scrollbar-width: thin; scrollbar-color: #cfd8ea transparent;
}
.mc-log::-webkit-scrollbar { width: 4px; }
.mc-log::-webkit-scrollbar-thumb { background: #cfd8ea; border-radius: 4px; }

/* ---------- bubbles ---------- */
.mc-msg {
  position: relative; max-width: 86%; padding: calc(10 * var(--dpx)) calc(13 * var(--dpx));
  border-radius: calc(16 * var(--dpx)); font-size: calc(17 * var(--dpx)); line-height: 1.5; overflow-wrap: anywhere;
}
.mc-msg p { margin: 0; }
.mc-bot {
  align-self: flex-start; background: #fff; border: 1px solid var(--mc-line);
  border-end-start-radius: calc(4 * var(--dpx)); box-shadow: 0 1px 2px rgba(2,1,64,.04);
}
.mc-user {
  align-self: flex-end; background: var(--mc-blue); color: #fff; font-weight: 300;
  border-end-end-radius: calc(4 * var(--dpx)); box-shadow: 0 4px 12px rgba(60,101,227,.22);
}
.mc-bot.mc-wide { width: 94%; max-width: 94%; padding: 0; background: transparent; border: 0; box-shadow: none; }
.mc-bot.mc-bare { padding: 0; background: transparent; border: 0; box-shadow: none; }
.mc-bot:has(> .mc-wave) { margin-top: calc(9 * var(--dpx)); }
.mc-sub { display: block; margin-top: calc(5 * var(--dpx)); font-size: calc(13 * var(--dpx)); color: var(--mc-slate); }
.mc-why { margin-top: calc(6 * var(--dpx)); }

/* user-side file thumbnail ("קבלה.jpg") */
.mc-thumb { display: flex; align-items: center; gap: calc(9 * var(--dpx)); padding: calc(7 * var(--dpx)) calc(8 * var(--dpx)) calc(7 * var(--dpx)) calc(13 * var(--dpx)); }
.mc-thumb-img { width: calc(42 * var(--dpx)); height: calc(42 * var(--dpx)); border-radius: calc(9 * var(--dpx)); background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.mc-thumb-img .mc-ic { width: calc(22 * var(--dpx)); height: calc(22 * var(--dpx)); }
.mc-thumb-t b { display: block; font-size: calc(15 * var(--dpx)); }
.mc-thumb-t small { display: block; font-size: calc(12 * var(--dpx)); opacity: .8; }

/* typing dots (exist only while typing) */
.mc-typing {
  align-self: flex-start; display: flex; gap: calc(5 * var(--dpx)); padding: calc(13 * var(--dpx)) calc(15 * var(--dpx));
  background: #fff; border: 1px solid var(--mc-line); border-radius: calc(16 * var(--dpx)); border-end-start-radius: calc(4 * var(--dpx));
}
.mc-typing i { width: calc(7 * var(--dpx)); height: calc(7 * var(--dpx)); border-radius: 50%; background: #b9c2d9; }

/* wave tags (גל 1 · גל 2 · חזון) */
.mc-wave {
  display: inline-block; font-style: normal; font-size: calc(11.5 * var(--dpx)); font-weight: 700; line-height: 1;
  padding: calc(3.5 * var(--dpx)) calc(8 * var(--dpx)); border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--mc-blue); color: var(--mc-blue); background: #fff;
}
.mc-wave-vision { border: 1px dashed var(--mc-ink); color: var(--mc-ink); }
.mc-bot > .mc-wave { position: absolute; top: calc(-9 * var(--dpx)); inset-inline-end: calc(10 * var(--dpx)); z-index: 1; }
.mc-chip .mc-wave { margin-inline-start: calc(6 * var(--dpx)); font-size: calc(10.5 * var(--dpx)); padding: calc(2.5 * var(--dpx)) calc(6 * var(--dpx)); vertical-align: 1px; }
.mc-nowave .mc-wave { display: none; }
.mc-nowave .mc-bot:has(> .mc-wave) { margin-top: 0; }

/* ---------- quick replies ---------- */
.mc-chips { display: flex; flex-wrap: wrap; gap: calc(7 * var(--dpx)); justify-content: flex-start; padding: calc(2 * var(--dpx)) 0 calc(4 * var(--dpx)); }
.mc-chips.mc-used { display: none; }
.mc-chip {
  display: inline-flex; align-items: center; min-height: calc(38 * var(--dpx)); max-width: 100%;
  padding: calc(8 * var(--dpx)) calc(14 * var(--dpx)); border-radius: 999px; text-align: start;
  font-size: calc(15 * var(--dpx)); font-weight: 700; line-height: 1.3;
  background: #fff; color: var(--mc-blue); border: calc(1.4 * var(--dpx)) solid #c9d6f6;
  box-shadow: 0 1px 2px rgba(60,101,227,.08);
  transition: background var(--dur-fast, 200ms), border-color var(--dur-fast, 200ms), transform 120ms;
}
.mc-chip:hover:not([disabled]) { background: #f1f5ff; border-color: var(--mc-blue); }
.mc-chip.mc-star { background: var(--mc-mint); border-color: var(--mc-mint); color: var(--mc-ink); }
.mc-chip.mc-star:hover:not([disabled]) { background: var(--mig-green-600, #8fe086); border-color: var(--mig-green-600, #8fe086); }
.mc-chip.mc-alt { color: var(--mc-slate); border-color: var(--mc-line); font-weight: 300; }
.mc-chip.mc-press, .mc-chip:active:not([disabled]) { transform: scale(.96); }
.mc-chip.mc-press { box-shadow: 0 0 0 calc(3 * var(--dpx)) rgba(60,101,227,.28); }
.mc-chip[disabled] { opacity: .5; }
.mc-rating { gap: calc(8 * var(--dpx)); }
.mc-rate { width: calc(44 * var(--dpx)); height: calc(44 * var(--dpx)); min-height: 0; padding: 0; justify-content: center; border-radius: 50%; font-size: calc(17 * var(--dpx)); font-variant-numeric: tabular-nums; }

/* ---------- dividers, system card, end card ---------- */
.mc-divider { display: flex; align-items: center; gap: calc(10 * var(--dpx)); margin: calc(8 * var(--dpx)) 0 calc(4 * var(--dpx)); color: var(--mc-slate); font-size: calc(12.5 * var(--dpx)); font-weight: 700; text-align: center; }
.mc-divider::before, .mc-divider::after { content: ""; flex: 1; height: 1px; background: #d7dfec; }
.mc-divider span { max-width: 78%; }
.mc-system {
  align-self: stretch; display: flex; align-items: flex-start; gap: calc(8 * var(--dpx));

<script>/* Migdal Care v3 · demo.js · the demo: one phone, one free chat, one sample customer (עמית).

    disableChoices(c);
    enqueue(async t => {
      user(c.l);
      await wait(REDUCED() ? 60 : 280, t);
      await play(c, t);
    });
  }
  function send(text) {
    text = String(text || '').trim();
    if (!text) return;
    enqueue(async t => {
      const target = resolve(text);
      disableChoices(target && target.kind ? target : null);
      user(text);
      await wait(REDUCED() ? 60 : 280, t);
      await play(target, t);
    });
  }
  function submit() {
    const v = E.input.value;
    E.input.value = '';
    E.form.classList.add('dm-empty');
    send(v);
  }

  /* ---------------- toast and sheet ---------------- */
  function toast(text) {
    const old = E.layer.querySelector('.mc-toast');
    if (old) old.remove();
    const el = h('div', { class: 'mc-toast', role: 'status', rich: text });
    E.layer.appendChild(el);
    requestAnimationFrame(() => el.classList.add('mc-on'));
    setTimeout(() => { el.classList.remove('mc-on'); setTimeout(() => el.remove(), 300); }, 2200);
  }
  function sheet(title, body) {
    const back = document.activeElement;
    const close = () => {
      scrim.classList.remove('mc-on'); box.classList.remove('mc-on');
      document.removeEventListener('keydown', esc, true);
      setTimeout(() => { scrim.remove(); box.remove(); }, 320);
      try { if (back && back.focus) back.focus({ preventScroll: true }); } catch (e) { /* noop */ }
    };
    const esc = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
    const scrim = h('div', { class: 'mc-scrim', onclick: close });
    const box = h('div', { class: 'mc-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title }, [
      h('i', { class: 'mc-grip', 'aria-hidden': 'true' }),
      h('b', { class: 'mc-sheet-t', rich: title }),
      h('p', { rich: body }),
      h('div', { class: 'mc-actions' }, h('button', { type: 'button', class: 'mc-btn mc-btn-ghost', onclick: close }, h('span', { text: 'סגירה' })))
    ]);
    append(E.layer, [scrim, box]);
    document.addEventListener('keydown', esc, true);
    requestAnimationFrame(() => { scrim.classList.add('mc-on'); box.classList.add('mc-on'); const b = box.querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* noop */ } });
  }

  /* ---------------- start, restart, deep links ---------------- */
  const DEEP = {
    physio: 'יש לי כיסוי לפיזיותרפיה?',
    specialist: 'יש לי כיסוי להתייעצות עם אורתופד?',
    surgery: 'האורתופד המליץ על ניתוח ארתרוסקופיה בברך. זה מכוסה?',
    claim: 'מה עם התביעה שלי?',
    car: 'ביטוח רכב, אפשר?',
    travel: 'אני בחו״ל ואבדה לי המזוודה'
  };
  const DEEP_ALIAS = { s1: 'physio', s2: 'specialist', s7: 'surgery', s8: 'claim', s6: 'car', '1': 'physio', '2': 'specialist', '7': 'surgery', '8': 'claim', '6': 'car' };
  function deepKey() {
    let raw = '';
    try { raw = decodeURIComponent(String(location.hash || '').replace(/^#/, '')); } catch (e) { raw = ''; }
    if (!raw) return null;
    let k = raw;
    if (raw.indexOf('=') >= 0) { try { k = new URLSearchParams(raw).get('s') || ''; } catch (e) { k = ''; } }
    k = String(k).trim().toLowerCase();
    if (DEEP[k]) return k;
    return DEEP_ALIAS[k] || null;
  }
  /* the deep-linked question is typed into the composer, then sent */
  async function typeIn(text, t) {
    if (REDUCED()) return;
    const per = Math.min(30, 800 / Math.max(1, text.length));
    E.form.classList.remove('dm-empty');
    for (let i = 1; i <= text.length; i++) { E.input.value = text.slice(0, i); await wait(per, t); }
    await wait(220, t);
    E.send.classList.add('mc-press');
    await wait(140, t);
    E.send.classList.remove('mc-press');
    E.input.value = '';
    E.form.classList.add('dm-empty');
  }

  function start(deep) {
    const day = h('div', { class: 'dm-day' }, [h('span', { text: 'היום, ' + CLOCK }), h('span', { class: 'dm-day-s', text: ' · נתוני דוגמה' })]);
    put(day);
    enqueue(async t => {
      await wait(REDUCED() ? 50 : 450, t);
      await play(['greet'], t);
      if (deep && DEEP[deep]) {
        await wait(REDUCED() ? 50 : 600, t);
        await typeIn(DEEP[deep], t);
        const target = resolve(DEEP[deep]);
        disableChoices(null);
        user(DEEP[deep]);
        await wait(REDUCED() ? 60 : 280, t);
        await play(target, t);
      }
      if (FINE()) { try { E.input.focus({ preventScroll: true }); } catch (e) { /* noop */ } }
    });
  }
  function restart(deep) {
    token++;
    typingOff();
    S = fresh();
    pin = null;
    while (E.log.firstChild) E.log.removeChild(E.log.firstChild);
    while (E.layer.firstChild) E.layer.removeChild(E.layer.firstChild);
    E.input.value = '';
    E.form.classList.add('dm-empty');
    E.log.scrollTop = 0;
    E.top.classList.remove('dm-scrolled');
    if (!deep && location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* noop */ } }
    start(deep || null);
  }

  /* the phone's visible height (the on-screen keyboard shrinks it); used by demo.css under 520px */
  function viewport() {
    const v = window.visualViewport;
    document.documentElement.style.setProperty('--vvh', Math.round(v ? v.height : window.innerHeight) + 'px');
  }

  function init() {
    const root = document.getElementById('phone');
    if (!root || !R) return;
    build(root);
    S = fresh();
    document.querySelectorAll('[data-restart]').forEach(b => b.addEventListener('click', () => restart()));
    window.addEventListener('hashchange', () => { const k = deepKey(); if (k) restart(k); });
    viewport();
    if (window.visualViewport) window.visualViewport.addEventListener('resize', viewport);
    window.addEventListener('resize', viewport);
    start(deepKey());
    window.MCDemo = { send: send, restart: () => restart(), state: () => S };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
